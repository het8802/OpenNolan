<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Setting up OpenNolan</title>
  <style>
    :root { color-scheme: light; }
    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'Inter', system-ui, sans-serif;
      background: #FBF7F0; color: #2b2b2b;
      height: 100vh; display: flex; flex-direction: column;
      padding: 32px 34px;
    }
    h1 { font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
    p.sub { margin-top: 6px; color: #7a7266; font-size: 13px; line-height: 1.5; }
    .bar { margin: 20px 0 14px; height: 4px; border-radius: 4px; background: #ece3d6; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 40%; border-radius: 4px; background: #d97757;
               animation: slide 1.3s ease-in-out infinite; }
    @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    #log {
      flex: 1; overflow-y: auto; background: #fff; border: 1px solid #ece3d6; border-radius: 8px;
      padding: 12px 14px; font-family: 'SF Mono', 'JetBrains Mono', monospace; font-size: 11px;
      line-height: 1.65; color: #6b6357; white-space: pre-wrap; word-break: break-word;
    }
    #log .err { color: #c0392b; }
    .foot { margin-top: 12px; font-size: 11.5px; color: #9a9184; }
  </style>
</head>
<body>
  <h1>Setting up OpenNolan</h1>
  <p class="sub">First launch only. Installing the local video engine and its dependencies into
    your Application Support folder. This can take a few minutes.</p>
  <div class="bar" id="bar"><i></i></div>
  <div id="log"></div>
  <div class="foot" id="foot">Working…</div>
  <script>
    const log = document.getElementById('log');
    const foot = document.getElementById('foot');
    const bar = document.getElementById('bar');
    function line(t, cls) {
      const d = document.createElement('div');
      if (cls) d.className = cls;
      d.textContent = t;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }
    const api = window.openNolanSetup;
    if (api) {
      api.onProgress((l) => line(l));
      api.onDone(() => { foot.textContent = 'Done — starting OpenNolan…'; bar.style.display = 'none'; });
      api.onError((m) => { foot.textContent = 'Setup failed.'; bar.style.display = 'none'; line(m, 'err'); });
    }
  </script>
</body>
</html>
