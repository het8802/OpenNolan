# Build + sign + notarize + publish the OpenNolan Mac app on a version tag.
#
# SETUP REQUIRED before this runs green (see docs/RELEASE-mac.md):
#   1. Replace OWNER_PLACEHOLDER/REPO_PLACEHOLDER in desktop/package.json build.publish.
#   2. Add these repo secrets (Settings → Secrets and variables → Actions):
#        CSC_LINK                 base64 of your "Developer ID Application" .p12
#        CSC_KEY_PASSWORD         password for that .p12
#        APPLE_API_KEY_B64        base64 of your App Store Connect AuthKey_XXXX.p8
#        APPLE_API_KEY_ID         the key id
#        APPLE_API_ISSUER         the issuer uuid
#      (GITHUB_TOKEN is provided automatically for the Release upload.)
#   3. Add a build/icon.icns (1024px source) so the app isn't the default Electron icon.
#
# Trigger: push a tag like v0.1.0. Produces + uploads the arm64 .dmg, .zip, and latest-mac.yml.

name: release-mac
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-14   # Apple Silicon runner (arm64) — matches the only target we ship
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decode notary API key
        run: |
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}

      - name: Install deps
        run: |
          npm --prefix web ci
          npm --prefix desktop ci

      - name: Build, sign, notarize, publish
        run: npm --prefix desktop run dist -- --publish always
        env:
          # signing identity (Developer ID Application .p12)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # notarization (App Store Connect API key path is set in the decode step above)
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # GitHub Release upload (electron-builder github publisher)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the produced dmg is signed + notarized + stapled
        run: |
          DMG=$(ls desktop/dist/*.dmg | head -1)
          echo "verifying $DMG"
          spctl -a -vv --type install "$DMG"
          xcrun stapler validate "$DMG"
